services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgebench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-forgebench}
      POSTGRES_USER: ${DATABASE_USER:-forgebench}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-forgebench} -d ${DATABASE_NAME:-forgebench}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: forgebench-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: forgebench-ai
    restart: unless-stopped
    environment:
      APP_ENV: development
      REPOSITORY_SCAN_ROOT: /workspace/storage
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      TASK_CONTEXT_TOKEN_BUDGET: ${TASK_CONTEXT_TOKEN_BUDGET:-10000}
      TASK_OUTPUT_TOKEN_BUDGET: ${TASK_OUTPUT_TOKEN_BUDGET:-12000}
      REFERENCE_OUTPUT_TOKEN_BUDGET: ${REFERENCE_OUTPUT_TOKEN_BUDGET:-16000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/workspace/storage:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10

  validation-runner:
    image: code-factory-validation:local
    build:
      context: .
      dockerfile: apps/validation-runner/Dockerfile
    container_name: forgebench-validation-runner
    restart: unless-stopped
    environment:
      VALIDATION_RUNNER_TOKEN: ${VALIDATION_RUNNER_TOKEN:-local-validation-runner-token}
      VALIDATION_ALLOW_NETWORK: ${REFERENCE_VALIDATION_ALLOW_NETWORK:-true}
      VALIDATION_ARTIFACT_ROOT: /workspace/storage
      VALIDATION_IMAGE: code-factory-validation:local
      VALIDATION_EGRESS_NETWORK: forgebench-validation-egress
      VALIDATION_COMMAND_TIMEOUT_SECONDS: ${REFERENCE_VALIDATION_COMMAND_TIMEOUT_SECONDS:-1800}
      VALIDATION_MAX_WORKSPACE_BYTES: ${REFERENCE_VALIDATION_MAX_WORKSPACE_BYTES:-536870912}
    volumes:
      - artifacts:/workspace/storage:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: forgebench-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: forgebench-backend
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env.example
        required: true
      - path: ./apps/backend/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-forgebench}
      DATABASE_USER: ${DATABASE_USER:-forgebench}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_URL: http://ai-service:8000
      ARTIFACT_STORAGE_PATH: storage
      VALIDATION_RUNNER_URL: http://validation-runner:8010
      HARBOR_RUNNER_URL: http://harbor:8020
      VALIDATION_RUNNER_TOKEN: ${VALIDATION_RUNNER_TOKEN:-local-validation-runner-token}
      REFERENCE_VALIDATION_ALLOW_NETWORK: ${REFERENCE_VALIDATION_ALLOW_NETWORK:-true}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      validation-runner:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - artifacts:/workspace/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: forgebench-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  harbor:
    build:
      context: .
      dockerfile: apps/harbor/Dockerfile
    container_name: forgebench-harbor
    restart: unless-stopped
    volumes:
      - artifacts:/workspace/storage
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "harbor --version >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  artifacts:
  ollama_data:
