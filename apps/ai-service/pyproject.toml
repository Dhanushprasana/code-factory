[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "gitpython>=3.2.1",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "pgvector>=0.5.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "rank-bm25>=0.2.2",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
