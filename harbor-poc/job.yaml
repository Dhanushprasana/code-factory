schema_version: 1
job_name: hello-python-antigravity
jobs_dir: jobs
n_concurrent_trials: 1
n_attempts: 1
timeout_multiplier: 3.0

agents:
  - name: antigravity-cli
    model_name: gemini-3.1-flash-lite
    skip_model_parsing: true
    model_api_key_name: GEMINI_API_KEY

environment:
  delete: false   # keep containers alive in Docker Desktop after trial

tasks:
  - path: tasks/hello-python
